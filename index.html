<script>
/* ===== Wedding intro: opens ONLY when the wax seal is clicked/tapped; plays once ===== */
(function(){
  const intro=document.getElementById('weddingIntro'),seal=document.getElementById('waxSeal'),paper=document.getElementById('wiCard'),
        enter=document.getElementById('wiEnter'),last=intro.querySelector('.wi-last'),
        reduce=matchMedia('(min-width:99999px)').matches;
  const hv=document.querySelector('.hbv');
  if(hv&&reduce){hv.removeAttribute('autoplay');hv.pause()}
  document.body.style.overflow='hidden';
  let opened=false,entered=false;
  function ready(){
    intro.classList.add('wi-ready');
    setTimeout(function(){ if(!entered) enter.click(); }, 1800);
  }
  const ev=document.getElementById('envVid');
  if(ev){
    ev.src='assets/env.mp4?v=2';
    ev.playbackRate=1.12;
    ev.load();
  }
  let started=false;
  function openInvitation(){
    if(started)return;started=true;
    seal.removeEventListener('click',openInvitation);
    seal.setAttribute('aria-disabled','true');seal.removeAttribute('tabindex');
    const hint=intro.querySelector('.wi-hint');if(hint)hint.style.display='none';
    navigator.vibrate&&navigator.vibrate(20);
    intro.classList.add('wi-playing');
    if(!ev||!ev.isConnected||reduce){revealCard();return}
    let go=false;
    const rv=function(){
      if(go)return;go=true;
      ev.classList.add('done');
      revealCard();
    };
    ev.addEventListener('ended',rv);
    ev.addEventListener('timeupdate',function(){if(ev.currentTime>=3.8)rv()});
    ev.addEventListener('error',rv);
    setTimeout(rv,4600);
    try{
      ev.playbackRate=1.12;
      ev.currentTime=0;
      const pr=ev.play();
      pr&&pr.catch(rv);
    }catch(e){rv()}
  }
  function revealCard(){
    if(opened)return;opened=true;
    seal.setAttribute('aria-disabled','true');seal.removeAttribute('tabindex');
    paper.removeAttribute('aria-hidden');
    navigator.vibrate&&navigator.vibrate(20);
    intro.classList.add('wi-opened');
    // Tap anywhere to skip immediately to main invitation
    intro.style.cursor='pointer';
    intro.addEventListener('click',function(){ if(opened&&!entered) enter.click(); });
    if(reduce){ready();return}
    last.addEventListener('animationend',function f(e){if(e.animationName==='wiRv'){last.removeEventListener('animationend',f);ready()}});
    setTimeout(ready,2200);
  }

  seal.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvitation()}});

    if(e) e.stopPropagation();
    if(entered||!opened)return;entered=true;

    intro.addEventListener('transitionend',function(ev){if(ev.target===intro&&ev.propertyName==='opacity')finish()});
    setTimeout(finish,750);
  });
})();

  if(p.y>H+50||p.x<-80||p.x>W+80){if(p.ex2||(window.__calm&&ps.length>8)){ps.splice(i,1);continue}p.y=-40;p.x=Math.random()*W;p.ex=0;p.ey=0}
  var f=Math.cos(p.fp),af=Math.abs(f),back=f<0?1:0,s=SP[p.c][p.b][back];
  x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.scale(.2+.8*af,.78+.22*Math.cos(p.tp));
  x.globalAlpha=B.a*(.6+.4*af);x.drawImage(s.c,-s.P,-s.P);x.restore()}
 for(var j=0;j<sp.length;j++){var q=sp[j];q.y-=q.v*dt;if(q.y<-.05){q.y=1.05;q.x=Math.random()}
  var tw=.5+.5*Math.sin(t*1.8+q.p);if(tw>.15)star(q.x*W+Math.sin(t*.4+q.p)*10,q.y*H,q.s,tw*.7)}

/* ===== 3D motion: hero parallax, seal coin tilt, card depth ===== */
(function(){
if(matchMedia('(min-width:99999px)').matches)return;
var tx=0,ty=0,cx=0,cy=0,clamp=function(v){return Math.max(-1,Math.min(1,v))};
addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;tx=clamp((e.clientX/innerWidth-.5)*2);ty=clamp((e.clientY/innerHeight-.5)*2)},{passive:true});
function onOri(e){if(e.gamma==null)return;tx=clamp(e.gamma/22);ty=clamp((e.beta-55)/22)}
function gyro(){try{var D=window.DeviceOrientationEvent;if(D&&typeof D.requestPermission==='function'){D.requestPermission().then(function(r){if(r==='granted')addEventListener('deviceorientation',onOri)}).catch(function(){})}else addEventListener('deviceorientation',onOri)}catch(e){}}
var D0=window.DeviceOrientationEvent;if(!(D0&&typeof D0.requestPermission==='function'))gyro();
var seal=document.getElementById('waxSeal');if(seal)seal.addEventListener('click',gyro);
var hb=document.querySelector('.hb'),bg=hb&&hb.querySelector('.bg'),cp=hb&&hb.querySelector('.cpl img'),ht=hb&&hb.querySelector('.ht'),gn=hb&&hb.querySelector('.gnsh');
var items=[].slice.call(document.querySelectorAll('.pc,#evs .card,.vph,.scw')).map(function(el){return {el:el,rx:0,ry:0,v:false,cy:innerHeight/2}});
var vh=innerHeight;
function measureItems(){
  vh=innerHeight;
  for(var i=0;i<items.length;i++){
    if(items[i].v){
      var r=items[i].el.getBoundingClientRect();
      items[i].cy=r.top+r.height/2;
    }
  }
}
addEventListener('scroll',measureItems,{passive:true});
addEventListener('resize',measureItems,{passive:true});
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){items.forEach(function(it){if(it.el===e.target){it.v=e.isIntersecting;if(it.v){var r=it.el.getBoundingClientRect();it.cy=r.top+r.height/2;}}})})},{rootMargin:'80px'});items.forEach(function(it){io.observe(it.el)})}else items.forEach(function(it){it.v=true});
var run=true;
function frame(now){
 if(!run)return;requestAnimationFrame(frame);
 var t=now/1000;cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;
 var ux=cx+Math.sin(t*.55)*.2,uy=cy+Math.cos(t*.45)*.15;window.__tiltX=ux;
 if(seal&&seal.isConnected){
  var m=Math.min(1,Math.hypot(ux,uy)),ang=m*20;
  seal.style.rotate=m<.01?'1 0 0 0deg':(-uy).toFixed(3)+' '+ux.toFixed(3)+' 0 '+ang.toFixed(2)+'deg';
  seal.style.setProperty('--hx',(32+ux*-22).toFixed(1)+'%');seal.style.setProperty('--hy',(26+uy*-22).toFixed(1)+'%')}
 for(var i=0;i<items.length;i++){var it=items[i];if(!it.v)continue;
  var c=clamp((it.cy-vh/2)/(vh*.6));
  var trx=c*7,try_=ux*2.2*(1-Math.abs(c)*.5);
  if(Math.abs(trx-it.rx)>.04||Math.abs(try_-it.ry)>.04){
    it.rx+=(trx-it.rx)*.12;it.ry+=(try_-it.ry)*.12;
    it.el.style.transform='perspective(1100px) rotateX('+it.rx.toFixed(2)+'deg) rotateY('+it.ry.toFixed(2)+'deg) translateZ(0)';
  }
 }
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',function(){if(document.hidden)run=false;else if(!run){run=true;requestAnimationFrame(frame)}});
})();
